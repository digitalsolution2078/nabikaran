<!doctype html>
<html lang="ne">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#55239a">
<title>Offline · Nabikaran</title>
<style>
  :root { --brand: #55239a; --brand-dark: #3f1675; --ink: #0f172a; --heading: #1e1338; --muted: #64748b; --line: #e6dfef; --bg: #f8f7fc; --surface: #fff; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--ink);
         font: 16px/1.6 -apple-system, system-ui, "Segoe UI", Roboto, "Noto Sans Devanagari", "Nirmala UI", Helvetica, Arial, sans-serif; }
  .card { width: min(420px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 28px 24px; text-align: center;
          box-shadow: 0 8px 24px -4px rgba(45, 18, 80, 0.07); }
  img { width: 64px; height: 64px; }
  h1 { font-size: 22px; font-weight: 800; color: var(--heading); margin: 14px 0 6px; line-height: 1.25; }
  p { margin: 0 0 10px; color: var(--muted); }
  .ok { color: var(--ink); }
  button { margin-top: 10px; min-height: 44px; padding: 10px 20px; border: 0; border-radius: 10px; background: var(--brand); color: #fff; font: 600 15px/1 inherit; cursor: pointer; }
  button:hover { background: var(--brand-dark); }
</style>
</head>
<body>
  <main class="card">
    <img src="/icon-192.png" alt="" width="64" height="64">
    <h1>इन्टरनेट जडान छैन</h1>
    <p>You are offline. Check your mobile data or Wi-Fi and try again.</p>
    <p class="ok">तपाईंका रिमाइन्डरहरू सुरक्षित छन् — SMS हाम्रो सर्भरबाट तोकिएको समयमै जान्छ।<br><span style="color:var(--muted)">Your reminders are safe: messages are sent from our server on schedule.</span></p>
    <button type="button" onclick="location.reload()">फेरि प्रयास गर्नुहोस् · Try again</button>
  </main>
  <script>window.addEventListener("online", function () { location.reload(); });</script>
</body>
</html>
