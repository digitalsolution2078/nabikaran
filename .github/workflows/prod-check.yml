name: Production check

# Runs after every successful deploy, every 30 minutes (uptime) and by hand,
# from GitHub's servers: confirms https://nabikaran.org is up, the database
# answers, every embedded schema step is in place, and the MCP endpoint used by
# ChatGPT / Claude is reachable. A failure is emailed to the repository owner.
on:
  workflow_run:
    workflows: [Deploy]
    types: [completed]
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Health, database and schema
        env:
          URL: https://nabikaran.org/api/health
        run: |
          set -u
          for i in $(seq 1 20); do
            code=$(curl -sS -o health.json -w '%{http_code}' --max-time 20 "$URL" || echo 000)
            echo "attempt $i: HTTP $code $(head -c 400 health.json 2>/dev/null)"
            if [ "$code" = 200 ] || [ "$code" = 503 ]; then
              if jq -e '.db == "ok" and (.schema // {} | length > 0) and (.schema | all(.[]; . == true))' health.json >/dev/null; then
                echo "::notice::Production OK: $(jq -c '{status, db, schema, dispatcher: .dispatcher.ok}' health.json)"
                exit 0
              fi
            fi
            sleep 30
          done
          echo "::error::Production check failed: $(cat health.json 2>/dev/null | head -c 400)"
          exit 1

      - name: MCP endpoint for ChatGPT / Claude
        run: |
          set -u
          meta=$(curl -sS --max-time 20 https://mcp.nabikaran.org/.well-known/oauth-protected-resource || true)
          echo "protected-resource: ${meta:0:300}"
          echo "$meta" | jq -e '.resource == "https://mcp.nabikaran.org/mcp"' >/dev/null \
            || { echo "::error::mcp.nabikaran.org metadata is wrong or unreachable (check Traefik route and MCP_PUBLIC_URL; docs/MCP_SETUP.md)"; exit 1; }
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 -X POST -H 'content-type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' https://mcp.nabikaran.org/mcp || echo 000)
          echo "unauthenticated /mcp: HTTP $code (401 expected)"
          [ "$code" = 401 ] || { echo "::error::/mcp should answer 401 without a token, got $code"; exit 1; }
          echo "::notice::MCP endpoint OK"
